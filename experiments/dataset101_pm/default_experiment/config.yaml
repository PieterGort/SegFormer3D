# wandb parameters
project: segformer3d
wandb_parameters:
  mode: "online"
  entity: pcgort
  group: dataset101_pm
  name: segformer3d_dataset101_pm
  resume: False
  tags: ["dataset101_pm", "ct", "nnunet", "segmentation"]

# model parameters
model_name: segformer3d
model_parameters:
    in_channels: 1
    sr_ratios: [4, 2, 1, 1]
    embed_dims: [32, 64, 160, 256]
    patch_kernel_size: [7, 3, 3, 3]
    patch_stride: [4, 2, 2, 2]
    patch_padding: [3, 1, 1, 1]
    mlp_ratios: [4, 4, 4, 4]
    num_heads: [1, 2, 5, 8]
    depths: [2, 2, 2, 2]
    num_classes: 14
    decoder_dropout: 0.0
    decoder_head_embedding_dim: 256

# loss function
loss_fn:
  loss_type: "dice"
  loss_args:
    to_onehot_y: False
    softmax: True
    sigmoid: False
    include_background: True

# optimizer
optimizer:
  optimizer_type: "adamw"
  optimizer_args:
    lr: 0.00005
    weight_decay: 0.01

# schedulers
warmup_scheduler:
  enabled: True
  warmup_epochs: 30

train_scheduler:
  scheduler_type: 'cosine_annealing_wr'
  scheduler_args:
    t_0_epochs: 200
    t_mult: 1
    min_lr: 0.000006

# (Not fully implemented yet) exponential moving average
ema:
  enabled: False
  ema_decay: 0.999
  val_ema_every: 1

sliding_window_inference:
  sw_batch_size: 4
  roi: [128, 128, 128]
  activation: "softmax"
  num_classes: 14
  include_background: True
  label_one_hot: True

# gradient clipping (not implemented yet)
clip_gradients:
  enabled: False
  clip_gradients_value: 0.1

# training hyperparameters
training_parameters:
  seed: 42
  num_epochs: 800
  cutoff_epoch: 400
  load_optimizer: False
  print_every: 200
  calculate_metrics: True
  val_every: 5
  grad_accumulate_steps: 1
  checkpoint_save_dir: "model_checkpoints/best_dice_checkpoint"
  load_checkpoint:
    load_full_checkpoint: False
    load_model_only: False
    load_checkpoint_path: null

# dataset args
dataset_parameters:
  dataset_type: "brats2017_seg"
  train_dataset_args:
    root: "/gpfs/work2/0/prjs1518/projects/SegFormer3D/Dataset101_PM_preprocessed_2mm"
    train: True
    fold_id: null
    roi_size: [128, 128, 128]
    num_samples: 6

  val_dataset_args:
    root: "/gpfs/work2/0/prjs1518/projects/SegFormer3D/Dataset101_PM_preprocessed_2mm"
    train: False
    fold_id: null

  train_dataloader_args:
    batch_size: 4
    shuffle: True
    num_workers: 16
    drop_last: True
    prefetch_factor: 3

  val_dataloader_args:
    batch_size: 1
    shuffle: False
    num_workers: 6
    drop_last: False
    prefetch_factor: 2
