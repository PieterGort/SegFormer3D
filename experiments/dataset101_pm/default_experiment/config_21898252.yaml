project: segformer3d
wandb_parameters:
  mode: online
  entity: pcgort
  group: dataset101_pm
  name: segformer3d_dataset101_pm
  resume: false
  tags:
  - dataset101_pm
  - ct
  - nnunet
  - segmentation
model_name: segformer3d
model_parameters:
  in_channels: 1
  sr_ratios:
  - 4
  - 2
  - 1
  - 1
  embed_dims:
  - 32
  - 64
  - 160
  - 256
  patch_kernel_size:
  - 7
  - 3
  - 3
  - 3
  patch_stride:
  - 4
  - 2
  - 2
  - 2
  patch_padding:
  - 3
  - 1
  - 1
  - 1
  mlp_ratios:
  - 4
  - 4
  - 4
  - 4
  num_heads:
  - 1
  - 2
  - 5
  - 8
  depths:
  - 2
  - 2
  - 2
  - 2
  num_classes: 14
  decoder_dropout: 0.0
  decoder_head_embedding_dim: 256
loss_fn:
  loss_type: dice
  loss_args:
    to_onehot_y: false
    softmax: true
    sigmoid: false
    include_background: true
optimizer:
  optimizer_type: adamw
  optimizer_args:
    lr: 0.0001
    weight_decay: 0.01
warmup_scheduler:
  enabled: true
  warmup_epochs: 20
train_scheduler:
  scheduler_type: cosine_annealing_wr
  scheduler_args:
    t_0_epochs: 400
    t_mult: 1
    min_lr: 6.0e-06
ema:
  enabled: false
  ema_decay: 0.999
  val_ema_every: 1
sliding_window_inference:
  sw_batch_size: 4
  roi:
  - 128
  - 128
  - 128
  activation: softmax
  num_classes: 14
  include_background: true
  label_one_hot: true
clip_gradients:
  enabled: false
  clip_gradients_value: 0.1
training_parameters:
  seed: 42
  num_epochs: 800
  cutoff_epoch: 400
  load_optimizer: false
  print_every: 200
  calculate_metrics: true
  grad_accumulate_steps: 1
  checkpoint_save_dir: model_checkpoints/best_dice_checkpoint_21898252
  load_checkpoint:
    load_full_checkpoint: false
    load_model_only: false
    load_checkpoint_path: null
dataset_parameters:
  dataset_type: brats2017_seg
  train_dataset_args:
    root: /gpfs/work2/0/prjs1518/projects/SegFormer3D/Dataset101_PM_preprocessed
    train: true
    fold_id: null
  val_dataset_args:
    root: /gpfs/work2/0/prjs1518/projects/SegFormer3D/Dataset101_PM_preprocessed
    train: false
    fold_id: null
  train_dataloader_args:
    batch_size: 2
    shuffle: true
    num_workers: 12
    drop_last: true
  val_dataloader_args:
    batch_size: 1
    shuffle: false
    num_workers: 6
    drop_last: false
